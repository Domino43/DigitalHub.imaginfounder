<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<!-- Primary Meta Tags -->
	<title>DigitalHub - Premium Digital Products | Templates, Fonts, UI Kits & More</title>
	<meta name="title" content="DigitalHub - Premium Digital Products | Templates, Fonts, UI Kits & More" />
	<meta name="description" content="Discover high-quality digital products for creators: website templates, handwritten fonts, UI kits, Notion templates, planners, and more. Instant download. Commercial license included." />
	<meta name="keywords" content="digital products, website templates, fonts, UI kits, Notion templates, digital planners, children's books, t-shirt designs, stock photos, commercial license, instant download" />
	<meta name="author" content="DigitalHub" />
	<meta name="generator" content="DigitalHub Storefront" />

	<!-- Canonical URL -->
	<link rel="canonical" href="https://digitalhub.imaginfounder.com/" />

	<!-- Open Graph / Facebook Meta Tags -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://digitalhub.imaginfounder.com/" />
	<meta property="og:title" content="DigitalHub - Premium Digital Products for Modern Creators" />
	<meta property="og:description" content="Discover high-quality digital products: website templates, handwritten fonts, UI kits, Notion templates, planners & more. Instant download with commercial license." />
	<meta property="og:image" content="https://digitalhub.imaginfounder.com/og-image.jpg" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:site_name" content="DigitalHub" />
	<meta property="og:locale" content="en_US" />

	<!-- Twitter Card Meta Tags -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:url" content="https://digitalhub.imaginfounder.com/" />
	<meta name="twitter:title" content="DigitalHub - Premium Digital Products" />
	<meta name="twitter:description" content="High-quality digital products for creators: templates, fonts, UI kits & more. Instant download with commercial license." />
	<meta name="twitter:image" content="https://digitalhub.imaginfounder.com/og-image.jpg" />

	<!-- Additional SEO Meta Tags -->
	<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
	<meta name="googlebot" content="index, follow" />
	<meta name="format-detection" content="telephone=no" />
	<meta http-equiv="x-ua-compatible" content="ie=edge" />

	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="/vite.svg" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

	<!-- Structured Data (Schema.org) for Organization -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "WebSite",
		"name": "DigitalHub",
		"url": "https://digitalhub.imaginfounder.com",
		"description": "Premium digital products marketplace for modern creators",
		"potentialAction": {
			"@type": "SearchAction",
			"target": "https://digitalhub.imaginfounder.com/products?search={search_term_string}",
			"query-input": "required name=search_term_string"
		}
	}
	</script>

	<!-- Structured Data for Organization -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "Organization",
		"name": "DigitalHub",
		"url": "https://digitalhub.imaginfounder.com",
		"logo": "https://digitalhub.imaginfounder.com/logo.png",
		"sameAs": [],
		"contactPoint": {
			"@type": "ContactPoint",
			"contactType": "Customer Service",
			"email": "support@digitalhub.com"
		}
	}
	</script>

	<!-- Structured Data for Product Collection -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "ItemList",
		"name": "Digital Products",
		"description": "Premium digital products for creators",
		"numberOfItems": 9,
		"itemListElement": [
			{
				"@type": "Product",
				"position": 1,
				"name": "Audrey Script Font Bundle",
				"description": "Elegant handwritten calligraphy font with 200+ glyphs",
				"offers": {
					"@type": "Offer",
					"price": "24.99",
					"priceCurrency": "USD"
				}
			},
			{
				"@type": "Product",
				"position": 2,
				"name": "Bloom Wellness Website Template",
				"description": "Modern responsive template for wellness brands",
				"offers": {
					"@type": "Offer",
					"price": "49.99",
					"priceCurrency": "USD"
				}
			},
			{
				"@type": "Product",
				"position": 3,
				"name": "Flux Flow Mobile UI Kit",
				"description": "Complete design system with 50+ screens",
				"offers": {
					"@type": "Offer",
					"price": "69.99",
					"priceCurrency": "USD"
				}
			}
		]
	}
	</script>

	<!-- Preconnect to external domains for performance -->
	<link rel="preconnect" href="https://www.paypal.com" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="dns-prefetch" href="https://www.paypal.com" />
</head>
<body>
	<div id="root"></div>
	<script type="module" src="/src/main.jsx"></script>
</body>
</html>
