    <script src="/_sdk/6740099151a06780.editing_sdk.js" integrity="sha512-eSc5OWFJjK6fUpxViOKXm5ekJ3Gp5icgygsjPVz9Xzudb9TkX/uNdpqNHc63uN0PdxYE9+g8pZAHIib0FgE0Cw=="></script>
    <script>
      lucide.createIcons();

      const RING_CIRC = 263.9;
      const ICONS = ['💧', '🏃', '📚', '🧘', '🍎', '😴', '✍️', '🎯', '🌱', '☀️'];
      let selectedIcon = ICONS[0];
      let habits = [];
      let busy = false;

      /* ---------- Icon picker ---------- */
      const picker = document.getElementById('icon-picker');
      ICONS.forEach((emoji, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'icon-pick w-11 h-11 rounded-xl bg-white/70 text-2xl flex items-center justify-center' + (i === 0 ? ' active' : '');
        b.textContent = emoji;
        b.setAttribute('aria-label', 'Icon ' + emoji);
        b.addEventListener('click', () => {
          selectedIcon = emoji;
          picker.querySelectorAll('.icon-pick').forEach(el => el.classList.remove('active'));
          b.classList.add('active');
        });
        picker.appendChild(b);
      });

      /* ---------- Helpers ---------- */
      function toast(msg) {
        const t = document.getElementById('toast');
        t.firstElementChild.textContent = msg;
        t.classList.remove('hidden');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.add('hidden'), 2800);
      }

      function isSameDay(iso, ref) {
        if (!iso) return false;
        return new Date(iso).toDateString() === ref.toDateString();
      }

      function doneToday(h) { return isSameDay(h.last_completed, new Date()); }

      /* ---------- Ambient gradient reacts to progress ---------- */
      function updateAmbience() {
        const totalTarget = habits.reduce((s, h) => s + (h.target_days || 0), 0);
        const totalDone = habits.reduce((s, h) => s + Math.min(h.completed_count || 0, h.target_days || 0), 0);
        const pct = totalTarget ? totalDone / totalTarget : 0;

        // interpolate cool dawn -> warm coral as progress rises
        const veil = document.getElementById('gradient-veil');
        const stops = [
          { t: 0, a: '#c9d6ff', b: '#e2c9e8', c: '#f6d9c9' },
          { t: 0.5, a: '#f7d9c4', b: '#f3c2b1', c: '#f9dfa8' },
          { t: 1, a: '#f9c99a', b: '#f2a488', c: '#f7d774' }
        ];
        let lo = stops[0],
          hi = stops[stops.length - 1];
        for (let i = 0; i < stops.length - 1; i++) {
          if (pct >= stops[i].t && pct <= stops[i + 1].t) { lo = stops[i];
            hi = stops[i + 1]; break; }
        }
        const span = (hi.t - lo.t) || 1;
        const f = (pct - lo.t) / span;
        const mix = (c1, c2) => {
          const p1 = [1, 3, 5].map(i => parseInt(c1.substr(i, 2), 16));
          const p2 = [1, 3, 5].map(i => parseInt(c2.substr(i, 2), 16));
          return '#' + p1.map((v, i) => Math.round(v + (p2[i] - v) * f).toString(16).padStart(2, '0')).join('');
        };
        const A = mix(lo.a, hi.a),
          B = mix(lo.b, hi.b),
          C = mix(lo.c, hi.c);
        veil.style.background = `linear-gradient(135deg, ${A} 0%, ${B} 55%, ${C} 100%)`;

        // ring + percent
        const p = Math.round(pct * 100);
        document.getElementById('progress-percent').textContent = p + '%';
        document.getElementById('progress-ring').style.strokeDashoffset = String(RING_CIRC * (1 - pct));
      }

      /* ---------- Card rendering ---------- */
      function fillCard(el, h) {
        el.dataset.id = h.__backendId;
        el.querySelector('[data-icon]').textContent = h.icon || '🎯';
        el.querySelector('[data-title]').textContent = h.title;
        el.querySelector('[data-streak]').textContent = h.streak || 0;

        const target = h.target_days || 1;
        const done = Math.min(h.completed_count || 0, target);
        el.querySelector('[data-fill]').style.width = Math.round((done / target) * 100) + '%';
        el.querySelector('[data-count]').textContent = done + ' / ' + target;

        const isDone = doneToday(h);
        el.querySelector('[data-done-btn]').classList.toggle('hidden', isDone);
        el.querySelector('[data-done-today]').classList.toggle('hidden', !isDone);
        el.querySelector('[data-done-today]').classList.toggle('inline-flex', isDone);
      }

      function wireCard(el) {
        const getHabit = () => habits.find(h => h.__backendId === el.dataset.id);

        el.querySelector('[data-done-btn]').addEventListener('click', () => markDone(getHabit(), el));

        const actions = el.querySelector('[data-actions]');
        const confirm = el.querySelector('[data-confirm]');
        el.querySelector('[data-del-btn]').addEventListener('click', () => {
          actions.classList.add('hidden');
          confirm.classList.remove('hidden');
          confirm.classList.add('flex');
        });
        el.querySelector('[data-cancel-btn]').addEventListener('click', () => {
          confirm.classList.add('hidden');
          confirm.classList.remove('flex');
          actions.classList.remove('hidden');
          actions.classList.add('flex');
        });
        el.querySelector('[data-confirm-btn]').addEventListener('click', () => removeHabit(getHabit()));
      }

      function renderList() {
        const list = document.getElementById('habit-list');
        const empty = document.getElementById('empty-state');
        empty.style.display = habits.length ? 'none' : 'block';

        const existing = new Map([...list.children].map(c => [c.dataset.id, c]));
        const tpl = document.getElementById('habit-card-template');

        habits.forEach(h => {
          let el = existing.get(h.__backendId);
          if (el) {
            fillCard(el, h);
            existing.delete(h.__backendId);
          } else {
            el = tpl.content.firstElementChild.cloneNode(true);
            fillCard(el, h);
            wireCard(el);
            list.appendChild(el);
          }
        });
        existing.forEach(el => el.remove());
        lucide.createIcons();
        updateAmbience();
      }

      /* ---------- Data operations ---------- */
      const addBtn = document.getElementById('add-button');
      const addLabel = document.getElementById('add-button-label');
      const addLoading = document.getElementById('add-button-loading');

      document.getElementById('habit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (busy) return;
        const titleInput = document.getElementById('habit-title');
        const title = titleInput.value.trim();
        const target = Math.max(1, parseInt(document.getElementById('habit-target').value, 10) || 1);
        if (!title) { toast('Give your habit a name first.'); return; }
        if (habits.length >= 999) { toast('Habit limit reached (999). Delete one to add more.'); return; }

        busy = true;
        addBtn.disabled = true;
        addLabel.classList.add('hidden');
        addLoading.classList.remove('hidden');

        const res = await window.dataSdk.create({
          title,
          icon: selectedIcon,
          target_days: target,
          completed_count: 0,
          streak: 0,
          last_completed: '',
          created_at: new Date().toISOString()
        });

        if (res.isOk) {
          titleInput.value = '';
          document.getElementById('habit-target').value = '30';
          toast('Habit added ✨');
        } else {
          toast('Could not save. Try again.');
        }
        busy = false;
        addBtn.disabled = false;
        addLabel.classList.remove('hidden');
        addLoading.classList.add('hidden');
      });

      async function markDone(h, el) {
        if (!h || busy || doneToday(h)) return;
        busy = true;
        const btn = el.querySelector('[data-done-btn]');
        btn.disabled = true;

        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(today.getDate() - 1);
        let newStreak = 1;
        if (isSameDay(h.last_completed, yesterday)) newStreak = (h.streak || 0) + 1;

        const updated = {
          ...h,
          completed_count: (h.completed_count || 0) + 1,
          streak: newStreak,
          last_completed: today.toISOString()
        };

        const res = await window.dataSdk.update(updated);
        if (res.isOk) toast('Nice work — streak ' + newStreak + ' 🔥');
        else { toast('Could not update. Try again.');
          btn.disabled = false; }
        busy = false;
      }

      async function removeHabit(h) {
        if (!h || busy) return;
        busy = true;
        const res = await window.dataSdk.delete(h);
        if (!res.isOk) toast('Could not delete. Try again.');
        busy = false;
      }

      /* ---------- Init ---------- */
      const handler = {
        onDataChanged(data) {
          habits = data.slice().sort((a, b) =>
            new Date(a.created_at || 0) - new Date(b.created_at || 0));
          renderList();
        }
      };

      (async () => {
        const init = await window.dataSdk.init(handler);
        if (!init.isOk) toast('Storage unavailable right now.');
      })();
    </script>
