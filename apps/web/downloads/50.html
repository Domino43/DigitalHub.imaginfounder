<script>export const generateLicenseKey = (productPrefix = "DH") => {
  const segments = [];
  for (let i = 0; i < 4; i++) {
    let segment = "";
    for (let j = 0; j < 4; j++) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      segment += chars[Math.floor(Math.random() * chars.length)];
    }
    segments.push(segment);
  }
  return `${productPrefix}-${segments.join("-")}`;
};

// Generate a secure, time-limited download URL
export const generateDownloadLink = (productId, variantId, expiresInHours = 72) => {
  const expiry = Date.now() + expiresInHours * 60 * 60 * 1000;
  const token = btoa(`${productId}:${variantId}:${expiry}`);
  return `${window.location.origin}/download?token=${token}&expires=${expiry}`;
};

// Get license info for a product
export const getLicenseInfo = (product) => {
  const category = product?.type?.value || "Ebooks";
  return LICENSE_TYPES[category] || LICENSE_TYPES["Ebooks"];
};

// Store purchase record (for future PocketBase integration)
export const createPurchaseRecord = (orderItems, orderNumber, customerEmail) => {
  return orderItems.map((item) => {
    const license = getLicenseInfo(item.product);
    const licenseKey = generateLicenseKey(item.product.id.slice(5, 8).toUpperCase());
    const downloadLink = generateDownloadLink(item.product.id, item.variant.id);
    
    return {
      order_number: orderNumber,
      customer_email: customerEmail,
      product_id: item.product.id,
      product_title: item.product.title,
      variant_id: item.variant.id,
      variant_title: item.variant.title,
      license_type: license.name,
      license_key: licenseKey,
      license_terms: license.terms,
      download_link: downloadLink,
      purchased_at: new Date().toISOString(),
      expires_at: new Date(Date.now() + 72 * 60 * 60 * 1000).toISOString(),
    };
  });
};
